<!DOCTYPE html>
<html lang="de">
<head>
    <!-- Basis -->
    <meta charset="UTF-8" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <!-- iOS / PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="default"
    />
    <meta name="apple-mobile-web-app-title" content="Health Stack" />

    <!-- Theme -->
    <meta name="theme-color" content="#f3f0eb" />

    <!-- SEO -->
    <meta
        name="description"
        content="Modernes Health Dashboard zur Übersicht deiner Gesundheitsdaten."
    />

    <title>Health Dashboard</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    />

    <!-- React -->
    <script
        crossorigin
        src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"
    ></script>

    <script
        crossorigin
        src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"
    ></script>

    <!-- Babel (nur für Development sinnvoll) -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"
    ></script>

    <!-- Supabase -->
    <script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4/+esm"
        type="module"
    ></script>

    <style>
        /* Nur Farben geändert */

        :root {
            --bg: #f3f0eb;
            --text: #2b2a28;
            --card: #fbfaf8;
            --accent: #7c8fa3;
            --border: rgba(60, 60, 60, 0.08);
            --scrollbar: #cfc8be;
        }

        body {
            background: var(--bg);
            color: var(--text);
        }

        input[type="range"] {
            accent-color: #7c8fa3;
        }

        ::-webkit-scrollbar-thumb {
            background: #cfc8be;
        }

        .card {
            background: #fbfaf8;
            border: 1px solid rgba(60, 60, 60, 0.06);
            box-shadow:
                0 4px 10px rgba(0, 0, 0, 0.03),
                0 2px 4px rgba(0, 0, 0, 0.02);
        }
    </style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">

/* ===== NUR FARBEN ANGEPASST ===== */

const STATUS_CFG={
  aktiv:     {label:"Aktiv ✓",      bg:"#e7f3ec",text:"#4d7b62",border:"#b8d2c2"},
  optimieren:{label:"Optimieren ⟳", bg:"#f6efe3",text:"#b28552",border:"#dec7a3"},
  fehlend:   {label:"Fehlt !",      bg:"#f7eaea",text:"#c07a7a",border:"#e0bcbc"},
  optional:  {label:"Optional",     bg:"#ececf5",text:"#7778a8",border:"#c8c8df"},
  labor:     {label:"Labor zuerst", bg:"#f1f1f1",text:"#7d7d7d",border:"#d7d7d7"},
  pausiert:  {label:"Pausiert",     bg:"#f1f1f1",text:"#9a9a9a",border:"#d7d7d7"},
};

const CAT_COLOR={
  medikament:"#8c94c8",
  basis:"#7ca8b8",
  performance:"#c4a176"
};

const SQC={
  "Sehr gut":"#76a889",
  "Gut":"#93b8a1",
  "Mittel":"#d2b06b",
  "Schlecht":"#d19a72",
  "Sehr schlecht":"#c68b8b"
};

const INP={
  background:"#f8f6f2",
  border:"1px solid #ddd6cd",
  borderRadius:10,
  color:"#2f2d2a",
  padding:"11px 13px",
  fontSize:15,
  width:"100%",
  outline:"none",
  WebkitAppearance:"none"
};

function Sheet({onClose,title,children}){
return(
<div
onClick={e=>e.target===e.currentTarget&&onClose()}
style={{
position:"fixed",
inset:0,
background:"rgba(34,32,29,0.55)",
zIndex:100,
display:"flex",
alignItems:"flex-end",
justifyContent:"center"
}}>
<div style={{
background:"#f7f4ef",
borderRadius:"20px 20px 0 0",
padding:"18px 16px",
width:"100%",
maxWidth:520,
maxHeight:"88vh",
overflowY:"auto",
borderTop:"1px solid #ddd6cd"
}}>
<div style={{
width:36,
height:4,
background:"#d7d0c6",
borderRadius:2,
margin:"0 auto 14px"
}}/>
<div style={{
fontSize:17,
fontWeight:800,
color:"#2d2b28",
marginBottom:14
}}>
{title}
</div>
{children}
</div>
</div>
);
}

function Btns({onCancel,onSave,sl="Speichern",saving=false}){
return(
<div style={{display:"flex",gap:10,marginTop:6}}>
<button
onClick={onCancel}
style={{
flex:1,
background:"#f3f0eb",
border:"1px solid #d7d0c6",
borderRadius:12,
color:"#6f6a63",
padding:13,
fontSize:14
}}>
Abbrechen
</button>

<button
onClick={onSave}
disabled={saving}
style={{
flex:2,
background:"#7c8fa3",
border:"none",
borderRadius:12,
color:"#fff",
padding:13,
fontSize:15,
fontWeight:800,
opacity:saving?.7:1
}}>
{saving?"Speichern...":sl}
</button>
</div>
);
}

function StatCard({label,val,sub,color}){
return(
<div style={{
background:"#fbfaf8",
border:"1px solid #e2ddd5",
borderRadius:14,
padding:"11px 9px",
textAlign:"center"
}}>
<div style={{
fontSize:9,
color:"#8c867f",
marginBottom:4,
letterSpacing:1
}}>
{label}
</div>

<div style={{
fontSize:14,
fontWeight:800,
color:color||"#2d2b28",
letterSpacing:-0.5,
lineHeight:1.2
}}>
{val}
</div>

{sub&&<div style={{
fontSize:9,
color:"#8c867f",
marginTop:3
}}>
{sub}
</div>}
</div>
);
}

function RangeFilter({val,set}){
return(
<div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
{[{k:"7d",l:"7T"},{k:"30d",l:"30T"},{k:"90d",l:"3M"},{k:"all",l:"Alle"}].map(({k,l})=>(
<button
key={k}
onClick={()=>set(k)}
style={{
background:val===k?"#7c8fa3":"#fbfaf8",
border:`1px solid ${val===k?"#7c8fa3":"#ddd6cd"}`,
borderRadius:20,
color:val===k?"#fff":"#7d766f",
padding:"5px 12px",
fontSize:12,
fontWeight:600
}}>
{l}
</button>
))}
</div>
);
}

function ChartBox({title,legend,children}){
return(
<div style={{
background:"#fbfaf8",
border:"1px solid #e2ddd5",
borderRadius:14,
padding:"13px 8px 8px",
marginBottom:12
}}>
<div style={{
display:"flex",
justifyContent:"space-between",
paddingLeft:4,
paddingRight:8,
marginBottom:6,
alignItems:"center"
}}>
<div style={{
fontSize:10,
color:"#8c867f",
letterSpacing:2,
textTransform:"uppercase"
}}>
{title}
</div>

<div style={{display:"flex",gap:10}}>
{legend.map(({c,l})=>(
<div key={l} style={{
display:"flex",
alignItems:"center",
gap:4,
fontSize:9,
color:"#8c867f"
}}>
<div style={{
width:10,
height:2,
background:c,
borderRadius:1
}}/>
{l}
</div>
))}
</div>
</div>

{children}
</div>
);
}

function Spinner(){
return(
<div
className="spin"
style={{
width:22,
height:22,
border:"3px solid #ddd6cd",
borderTop:"3px solid #7c8fa3",
borderRadius:"50%",
display:"inline-block"
}}/>
);
}

function LoadingScreen({msg="Laden..."}){
return(
<div style={{
minHeight:"100svh",
background:"#f3f0eb",
display:"flex",
flexDirection:"column",
alignItems:"center",
justifyContent:"center",
gap:16
}}>
<Spinner/>
<div style={{
fontSize:13,
color:"#8c867f"
}}>
{msg}
</div>
</div>
);
}

/* ===== HEADER COLORS ===== */

const headerStyle={
background:"linear-gradient(135deg,#f5f2ed,#ece8e1)",
borderBottom:"1px solid #ddd6cd"
};

const tabActive="#fbfaf8";
const tabText="#2d2b28";
const tabInactive="#8c867f";
const accent="#7c8fa3";

/* ===== BUTTON COLORS ===== */

const primaryButton={
background:"#7c8fa3",
color:"#fff",
boxShadow:"0 4px 20px rgba(124,143,163,0.25)"
};

</script>
</body>
</html>
