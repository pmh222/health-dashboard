function Chart({data,lines,refs=[],empty="Noch keine Einträge.",h=170}){
  const W=360,PL=38,PR=16,PT=14,PB=26,cW=W-PL-PR,cH=h-PT-PB;
  const vals=data.flatMap(d=>lines.map(l=>d[l.k]).filter(v=>v!=null&&!isNaN(v)));
  if(data.length<2||!vals.length)return(<div style={{height:h,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:6,color:"#374151",fontSize:12,padding:"0 20px",textAlign:"center"}}><span style={{fontSize:24,opacity:.1}}>📈</span>{data.length===1?"Noch eine Messung für den Verlauf.":empty}</div>);
  const mn=Math.max(0,Math.min(...vals)-5),mx=Math.max(...vals)+5;
  const tx=i=>PL+(i/(data.length-1))*cW,ty=v=>PT+(1-(v-mn)/(mx-mn))*cH;
  const path=pts=>pts.filter(Boolean).map(([x,y],i)=>`${i?"L":"M"}${x},${y}`).join(" ");
  const tks=[mn,Math.round((mn+mx)/2),mx];
  const xi=[0,Math.floor((data.length-1)/2),data.length-1].filter((v,i,a)=>a.indexOf(v)===i);
  return(<svg viewBox={`0 0 ${W} ${h}`} style={{width:"100%",height:h,overflow:"visible"}}>{tks.map(v=>(<g key={v}><line x1={PL} x2={PL+cW} y1={ty(v)} y2={ty(v)} stroke="#1e1e1e" strokeWidth={1}/><text x={PL-5} y={ty(v)+4} textAnchor="end" fontSize={9} fill="#6b7280">{Math.round(v)}</text></g>))}{refs.filter(r=>r.y>=mn&&r.y<=mx).map(r=>(<g key={r.y}><line x1={PL} x2={PL+cW} y1={ty(r.y)} y2={ty(r.y)} stroke={r.c} strokeWidth={1} strokeDasharray="5,3" opacity={.45}/><text x={PL+cW+2} y={ty(r.y)+4} fontSize={8} fill={r.c} opacity={.6}>{r.y}</text></g>))}{lines.map(l=>{const pts=data.map((d,i)=>d[l.k]!=null?[tx(i),ty(d[l.k])]:null);if(pts.filter(Boolean).length<2)return null;return(<g key={l.k}><path d={path(pts)} fill="none" stroke={l.c} strokeWidth={l.w||2.5} strokeDasharray={l.d||"none"}/>{data.map((d,i)=>d[l.k]!=null?<circle key={i} cx={tx(i)} cy={ty(d[l.k])} r={3.5} fill={l.c}/>:null)}</g>);})}{xi.map(i=><text key={i} x={tx(i)} y={h-4} textAnchor="middle" fontSize={9} fill="#6b7280">{data[i].lb}</text>)}</svg>);
}

    setLoading(true);setErr("");
    try{
      const res=mode==="login"?await sb.auth.signInWithPassword({email,password:pw}):await sb.auth.signUp({email,password:pw});
      if(res.error)setErr(res.error.message==="Invalid login credentials"?"E-Mail oder Passwort falsch.":res.error.message);

          <div style={{display:"flex",gap:4,marginBottom:22,background:"#1a1a1a",borderRadius:10,padding:3}}>

    setSaving(false);
  };
  const delBP=async id=>{const{error}=await sb.from('bp_log').delete().eq('id',id);if(!error)setBpLog(l=>l.filter(x=>x.id!==id));toast_("Gelöscht","warn");};

  const addSl=async()=>{
    if(!slF.date){toast_("Datum fehlt","warn");return;}
    setSaving(true);
    const entry={id:Date.now(),user_id:session.user.id,date:slF.date,dur:parseInt(slF.dur)||480,qual:slF.qual,hrv:parseFloat(slF.hrv)||null,rhr:parseInt(slF.rhr)||null,deep:parseInt(slF.deep)||0,rem:parseInt(slF.rem)||0,light:parseInt(slF.light)||0,awake:parseInt(slF.awake)||0,bb:parseInt(slF.bb)||null,note:slF.note.trim()};
    const{error}=await sb.from('sleep_log').insert(entry);
    if(!error){setSlLog(l=>[entry,...l].sort((a,b)=>new Date(b.date)-new Date(a.date)));setSlF({date:todayBerlin(),dur:480,qual:"Gut",hrv:"",rhr:"",deep:0,rem:0,light:0,awake:0,bb:"",note:""});setModal(null);toast_("Gespeichert!");}
    else toast_("Fehler: "+error.message,"warn");
    setSaving(false);
  };
  const delSl=async id=>{const{error}=await sb.from('sleep_log').delete().eq('id',id);if(!error)setSlLog(l=>l.filter(x=>x.id!==id));toast_("Gelöscht","warn");};

  const saveSupp=async()=>{
    if(!sF.name.trim())return;
    setSaving(true);
    if(editSId!==null){
      const{error}=await sb.from('supplements').update({name:sF.name,dose:sF.dose,timing:sF.timing,category:sF.category,status:sF.status,note:sF.note}).eq('id',editSId);
      if(!error){setSupps(s=>s.map(x=>x.id===editSId?{...x,...sF}:x));toast_("Aktualisiert!");}
      else toast_("Fehler","warn");
    } else {
      const entry={...sF,id:Date.now(),user_id:session.user.id,custom:true};
      const{error}=await sb.from('supplements').insert(entry);
      if(!error){setSupps(s=>[...s,entry]);toast_("Hinzugefügt!");}
      else toast_("Fehler","warn");
    }
    setModal(null);setEditSId(null);setSaving(false);
  };
  const setStatus=async(id,status)=>{await sb.from('supplements').update({status}).eq('id',id);setSupps(s=>s.map(x=>x.id===id?{...x,status}:x));toast_("Status aktualisiert!");};
  const delSupp=async id=>{await sb.from('supplements').delete().eq('id',id);setSupps(s=>s.filter(x=>x.id!==id));toast_("Entfernt","warn");};

  const exportData=()=>{const blob=new Blob([JSON.stringify({version:"3.0",exported:new Date().toISOString(),supps,bpLog,sleepLog:slLog},null,2)],{type:"application/json"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=`health-${todayBerlin()}.json`;a.click();URL.revokeObjectURL(url);};

  const bpCut=bpR==="all"?null:new Date(Date.now()-(bpR==="7d"?7:bpR==="30d"?30:90)*864e5);
  const bpFilt=bpCut?bpLog.filter(x=>new Date(x.ts)>=bpCut):[...bpLog];
  const bpChart=[...bpFilt].sort((a,b)=>new Date(a.ts)-new Date(b.ts)).map(x=>({sys:x.sys,dia:x.dia,pulse:x.pulse,lb:fmtD(x.ts)}));
  const bpAvg=bpFilt.length?{sys:Math.round(bpFilt.reduce((a,x)=>a+x.sys,0)/bpFilt.length),dia:Math.round(bpFilt.reduce((a,x)=>a+x.dia,0)/bpFilt.length)}:null;
  const slCut=slR==="all"?null:new Date(Date.now()-(slR==="7d"?7:slR==="30d"?30:90)*864e5);
  const slFilt=slCut?slLog.filter(x=>new Date(x.date)>=slCut):[...slLog];
  const slChart=[...slFilt].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(x=>({dur:parseFloat((x.dur/60).toFixed(1)),hrv:x.hrv,rhr:x.rhr,bb:x.bb,lb:fmtD(x.date+"T12:00")}));
  const slAvg=slFilt.length?{dur:Math.round(slFilt.reduce((a,x)=>a+x.dur,0)/slFilt.length),hrv:slFilt.filter(x=>x.hrv).length?+(slFilt.filter(x=>x.hrv).reduce((a,x)=>a+x.hrv,0)/slFilt.filter(x=>x.hrv).length).toFixed(0):null}:null;
  const filtSupps=supps.filter(s=>sfilt==="all"||s.category===sfilt||s.status===sfilt).sort((a,b)=>(PRIO[a.status]??9)-(PRIO[b.status]??9));
  const sc={a:supps.filter(s=>s.status==="aktiv").length,f:supps.filter(s=>s.status==="fehlend").length,o:supps.filter(s=>s.status==="optimieren").length};

  if(session===undefined)return <LoadingScreen msg="Verbinde mit Supabase..."/>;
  if(!session)return <AuthScreen/>;
  if(dataLoading)return <LoadingScreen msg="Daten werden geladen..."/>;

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100svh",overflow:"hidden"}}>
      <div style={{background:"linear-gradient(135deg,#0a0a0a,#111827)",borderBottom:"1px solid #1f2937",flexShrink:0,paddingTop:"env(safe-area-inset-top)"}}>
        <div style={{padding:"12px 14px 0",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:10,letterSpacing:3,color:"#6366f1",fontWeight:700,textTransform:"uppercase"}}>Triathlet · 70 kg · Berlin</div>
            <div style={{fontSize:17,fontWeight:800,color:"#f9fafb",letterSpacing:-0.5}}>Gesundheits-Dashboard</div>
          </div>
          <div style={{display:"flex",gap:6}}>
            <button onClick={exportData} style={{background:"#1a1a2e",border:"1px solid #3730a3",borderRadius:9,color:"#818cf8",padding:"6px 10px",fontSize:11,fontWeight:700,cursor:"pointer"}}>↑ Export</button>
            <button onClick={()=>sb.auth.signOut()} style={{background:"#1a1a1a",border:"1px solid #2a2a2a",borderRadius:9,color:"#6b7280",padding:"6px 10px",fontSize:11,cursor:"pointer"}}>Logout</button>
          </div>
        </div>
        <div style={{display:"flex",gap:1,padding:"10px 14px 0"}}>
          {[{k:"sleep",icon:"🌙",l:"Schlaf"},{k:"bp",icon:"🩺",l:"Blutdruck"},{k:"supps",icon:"💊",l:"Supps"}].map(({k,icon,l})=>(<button key={k} onClick={()=>setTab(k)} style={{flex:1,padding:"8px 0",fontSize:12,fontWeight:700,cursor:"pointer",background:tab===k?"#080808":"transparent",color:tab===k?"#f9fafb":"#6b7280",border:"none",borderRadius:"9px 9px 0 0",borderTop:tab===k?"2px solid #6366f1":"2px solid transparent"}}>{icon} {l}</button>))}
        </div>
      </div>

      <div style={{flex:1,overflowY:"auto",padding:"14px 14px",paddingBottom:"calc(90px + env(safe-area-inset-bottom))"}}>

        {tab==="sleep"&&<>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
            <StatCard label="LETZTE NACHT" val={slLog[0]?fmtDur(slLog[0].dur):"–"} sub={slLog[0]?.qual||""} color={slLog[0]?SQC[slLog[0].qual]:"#6b7280"}/>
            <StatCard label="Ø DAUER" val={slAvg?fmtDur(slAvg.dur):"–"} sub={`${slFilt.length} Nächte`} color="#60a5fa"/>
            <StatCard label="Ø HRV" val={slAvg?.hrv?`${slAvg.hrv} ms`:"–"} sub="Erholung" color="#a78bfa"/>
          </div>
          <RangeFilter val={slR} set={setSlR}/>
          <ChartBox title="Schlafdauer & HRV" legend={[{c:"#60a5fa",l:"Dauer (h)"},{c:"#a78bfa",l:"HRV (ms)"}]}>
            <Chart data={slChart} lines={[{k:"dur",c:"#60a5fa"},{k:"hrv",c:"#a78bfa",d:"5,3",w:1.5}]} refs={[{y:7,c:"#4ade80"},{y:8,c:"#fbbf24"}]} empty="Erste Nacht eintragen." h={165}/>
          </ChartBox>
          {slChart.some(x=>x.bb!=null)&&<ChartBox title="Body Battery & Ruhepuls" legend={[{c:"#f59e0b",l:"BB %"},{c:"#f87171",l:"RHR"}]}><Chart data={slChart} lines={[{k:"bb",c:"#f59e0b"},{k:"rhr",c:"#f87171",d:"5,3",w:1.5}]} refs={[]} empty="" h={130}/></ChartBox>}
          {slLog.length===0?<div style={{textAlign:"center",padding:"30px 0",color:"#4b5563",fontSize:13}}>Tippe auf + und trage deine erste Nacht ein!</div>:
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <div style={{fontSize:10,color:"#6b7280",letterSpacing:2,textTransform:"uppercase",marginBottom:2}}>Einträge</div>
            {slFilt.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(e=>(
              <div key={e.id} style={{background:"#0f0f0f",border:"1px solid #1a1a1a",borderRadius:14,padding:"12px 13px"}}>
                <div style={{display:"flex",gap:8}}>
                  <div style={{width:7,height:7,borderRadius:"50%",background:SQC[e.qual]||"#9ca3af",marginTop:5,flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap",marginBottom:4}}>
                      <span style={{fontWeight:800,fontSize:14,color:"#f1f5f9"}}>{fmtDur(e.dur)}</span>
                      <span style={{fontSize:10,color:SQC[e.qual],background:"#1a1a1a",borderRadius:5,padding:"1px 6px"}}>{e.qual}</span>
                      <span style={{fontSize:11,color:"#6b7280"}}>{fmtD(e.date+"T12:00")}</span>
                    </div>
                    <div style={{display:"flex",gap:10,flexWrap:"wrap",marginBottom:(e.deep||e.rem||e.light)?6:0}}>
                      {e.hrv&&<span style={{fontSize:11,color:"#a78bfa"}}>HRV {e.hrv} ms</span>}
                      {e.rhr&&<span style={{fontSize:11,color:"#f87171"}}>RHR {e.rhr} bpm</span>}
                      {e.bb&&<span style={{fontSize:11,color:"#f59e0b"}}>BB {e.bb}%</span>}
                    </div>
                    {(e.deep+e.rem+e.light)>0&&<PhaseBar deep={e.deep} rem={e.rem} light={e.light} awake={e.awake}/>}
                    {e.note&&<div style={{fontSize:10,color:"#6b7280",marginTop:4}}>{e.note}</div>}
                  </div>
                  <button onClick={()=>delSl(e.id)} style={{background:"transparent",border:"1px solid #3f1010",color:"#f87171",borderRadius:6,padding:"3px 8px",fontSize:11,cursor:"pointer",flexShrink:0}}>×</button>
                </div>
              </div>
            ))}
          </div>}
        </>}

        {tab==="bp"&&<>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:12}}>
            <StatCard label="LETZTE" val={bpLog[0]?`${bpLog[0].sys}/${bpLog[0].dia}`:"–"} sub={bpLog[0]?clBP(bpLog[0].sys,bpLog[0].dia).label:""} color={bpLog[0]?clBP(bpLog[0].sys,bpLog[0].dia).color:"#6b7280"}/>
            <StatCard label="Ø SCHNITT" val={bpAvg?`${bpAvg.sys}/${bpAvg.dia}`:"–"} sub={`${bpFilt.length} Messungen`} color={bpAvg?clBP(bpAvg.sys,bpAvg.dia).color:"#6b7280"}/>
            <StatCard label="GESAMT" val={bpLog.length} sub="Einträge" color="#818cf8"/>
          </div>
          <RangeFilter val={bpR} set={setBpR}/>
          <ChartBox title="Verlauf (mmHg)" legend={[{c:"#f87171",l:"Sys"},{c:"#60a5fa",l:"Dia"},{c:"#a78bfa",l:"Puls"}]}>
            <Chart data={bpChart} lines={[{k:"sys",c:"#f87171"},{k:"dia",c:"#60a5fa"},{k:"pulse",c:"#a78bfa",d:"5,3",w:1.5}]} refs={[{y:120,c:"#4ade80"},{y:90,c:"#fbbf24"},{y:140,c:"#f87171"}]} empty="Erste Messung eintragen." h={180}/>
          </ChartBox>
          {bpLog.length===0?<div style={{textAlign:"center",padding:"30px 0",color:"#4b5563",fontSize:13}}>Tippe auf + und trage deine erste Messung ein!</div>:
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <div style={{fontSize:10,color:"#6b7280",letterSpacing:2,textTransform:"uppercase",marginBottom:2}}>Einträge</div>
            {bpFilt.sort((a,b)=>new Date(b.ts)-new Date(a.ts)).map(e=>{const cl=clBP(e.sys,e.dia);return(
              <div key={e.id} style={{background:"#0f0f0f",border:"1px solid #1a1a1a",borderRadius:12,padding:"11px 13px",display:"flex",alignItems:"center",gap:10}}>
                <div style={{width:7,height:7,borderRadius:"50%",background:cl.color,flexShrink:0}}/>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{display:"flex",alignItems:"center",gap:7,flexWrap:"wrap"}}>
                    <span style={{fontWeight:800,fontSize:16,color:cl.color,letterSpacing:-0.5}}>{e.sys}/{e.dia}</span>
                    <span style={{fontSize:10,color:cl.color,background:"#1a1a1a",borderRadius:5,padding:"1px 6px"}}>{cl.label}</span>
                    {e.pulse&&<span style={{fontSize:10,color:"#a78bfa"}}>♥ {e.pulse}</span>}
                    <span style={{fontSize:10,color:"#4b5563"}}>{e.ctx}</span>
                  </div>
                  <div style={{fontSize:10,color:"#4b5563",marginTop:2}}>{fmtD(e.ts)} · {fmtT(e.ts)}{e.note&&<span style={{marginLeft:6,color:"#6b7280"}}>· {e.note}</span>}</div>
                </div>
                <button onClick={()=>delBP(e.id)} style={{background:"transparent",border:"1px solid #3f1010",color:"#f87171",borderRadius:6,padding:"3px 8px",fontSize:11,cursor:"pointer",flexShrink:0}}>×</button>
              </div>
            );})}
          </div>}
        </>}

        {tab==="supps"&&<>
          <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
            {[{l:"✓",v:sc.a,c:"#4ade80"},{l:"!",v:sc.f,c:"#f87171"},{l:"⟳",v:sc.o,c:"#fbbf24"},{l:"Σ",v:supps.length,c:"#818cf8"}].map(({l,v,c})=>(<div key={l} style={{background:"#0f172a",border:"1px solid #1e293b",borderRadius:10,padding:"6px 14px",textAlign:"center",minWidth:50}}><div style={{fontSize:18,fontWeight:800,color:c,lineHeight:1}}>{v}</div><div style={{fontSize:9,color:"#64748b"}}>{l}</div></div>))}
          </div>
          <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
            {[{k:"all",l:"Alle"},{k:"fehlend",l:"⚠ Fehlt"},{k:"optimieren",l:"⟳ Opti."},{k:"aktiv",l:"✓ Aktiv"},{k:"basis",l:"Basis"},{k:"performance",l:"Perf."}].map(({k,l})=>(<button key={k} onClick={()=>setSfilt(k)} style={{background:sfilt===k?"#6366f1":"#111",border:`1px solid ${sfilt===k?"#6366f1":"#2a2a2a"}`,borderRadius:20,color:sfilt===k?"#fff":"#9ca3af",padding:"5px 10px",fontSize:11,fontWeight:600,cursor:"pointer"}}>{l}</button>))}
          </div>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {filtSupps.map(s=>{const st=STATUS_CFG[s.status]||STATUS_CFG.aktiv;return(
              <div key={s.id} style={{background:"#0f0f0f",border:`1px solid ${s.status==="fehlend"?"#3f0e0e":s.status==="optimieren"?"#2d1f00":"#1a1a1a"}`,borderRadius:14,padding:"12px 13px"}}>
                <div style={{display:"flex",gap:9}}>
                  <div style={{width:7,height:7,borderRadius:"50%",background:CAT_COLOR[s.category]||"#6b7280",marginTop:6,flexShrink:0}}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{display:"flex",alignItems:"center",gap:6,flexWrap:"wrap"}}>
                      <span style={{fontWeight:700,fontSize:14,color:"#f1f5f9"}}>{s.name}</span>
                      <span style={{fontSize:9,background:st.bg,color:st.text,border:`1px solid ${st.border}`,borderRadius:5,padding:"1px 6px",fontWeight:600}}>{st.label}</span>
                      {s.custom&&<span style={{fontSize:9,color:"#6366f1",background:"#1e1b4b",borderRadius:4,padding:"1px 5px"}}>Eigener</span>}
                    </div>
                    <div style={{fontSize:11,color:"#94a3b8",marginTop:3}}>💊 {s.dose}{s.timing&&<span style={{color:"#64748b"}}> · 🕐 {s.timing}</span>}</div>
                    {s.note&&<div style={{fontSize:10,color:"#6b7280",marginTop:3,lineHeight:1.5}}>{s.note}</div>}
                    <div style={{display:"flex",gap:5,marginTop:8,flexWrap:"wrap"}}>
                      {Object.entries(STATUS_CFG).filter(([k])=>k!==s.status).slice(0,3).map(([k,v])=>(<button key={k} onClick={()=>setStatus(s.id,k)} style={{fontSize:9,background:"transparent",border:`1px solid ${v.border}`,color:v.text,borderRadius:5,padding:"2px 7px",cursor:"pointer",opacity:.8}}>→ {v.label}</button>))}
                      <button onClick={()=>{setSF({name:s.name,dose:s.dose,timing:s.timing,category:s.category,status:s.status,note:s.note});setEditSId(s.id);setModal("supp");}} style={{fontSize:9,background:"transparent",border:"1px solid #2a2a2a",color:"#9ca3af",borderRadius:5,padding:"2px 7px",cursor:"pointer"}}>✎</button>
                      {s.custom&&<button onClick={()=>delSupp(s.id)} style={{fontSize:9,background:"transparent",border:"1px solid #3f1010",color:"#f87171",borderRadius:5,padding:"2px 7px",cursor:"pointer"}}>×</button>}
                    </div>
                  </div>
                </div>
              </div>
            );})}
          </div>
        </>}
      </div>

      <div style={{position:"fixed",bottom:0,left:0,right:0,padding:"10px 14px",paddingBottom:"calc(10px + env(safe-area-inset-bottom))",background:"linear-gradient(transparent,#080808 35%)",pointerEvents:"none"}}>
        <button onClick={()=>{if(tab==="sleep"){setSlF({date:todayBerlin(),dur:480,qual:"Gut",hrv:"",rhr:"",deep:0,rem:0,light:0,awake:0,bb:"",note:""});setModal("sleep");}else if(tab==="bp"){setBpF({sys:"",dia:"",pulse:"",ctx:"Ruhe",note:"",dt:nowBerlin()});setModal("bp");}else{setSF({name:"",dose:"",timing:"",category:"basis",status:"aktiv",note:""});setEditSId(null);setModal("supp");}}} style={{display:"block",width:"100%",maxWidth:420,margin:"0 auto",background:"#6366f1",border:"none",borderRadius:14,color:"#fff",padding:"14px",fontSize:15,fontWeight:800,cursor:"pointer",boxShadow:"0 4px 24px rgba(99,102,241,0.4)",pointerEvents:"auto"}}>
          {tab==="sleep"?"+ Schlaf eintragen":tab==="bp"?"+ Blutdruck messen":"+ Supplement hinzufügen"}
        </button>
      </div>

      {modal==="sleep"&&(<Sheet onClose={()=>setModal(null)} title="🌙 Schlaf eintragen">
        <F label="DATUM"><input style={INP} type="date" value={slF.date} onChange={e=>setSlF(p=>({...p,date:e.target.value}))}/></F>
        <F label={`SCHLAFDAUER · ${fmtDur(slF.dur)}`}><input type="range" min={120} max={720} step={15} value={slF.dur} onChange={e=>setSlF(p=>({...p,dur:+e.target.value}))}/><div style={{display:"flex",justifyContent:"space-between",fontSize:10,color:"#4b5563",marginTop:1}}><span>2h</span><span>12h</span></div></F>
        <F label="SCHLAFQUALITÄT"><div style={{display:"flex",gap:5,flexWrap:"wrap"}}>{SQ.map(q=>(<button key={q} onClick={()=>setSlF(p=>({...p,qual:q}))} style={{flex:1,minWidth:80,background:slF.qual===q?SQC[q]+"22":"#1a1a1a",border:`1px solid ${slF.qual===q?SQC[q]:"#2a2a2a"}`,borderRadius:8,color:slF.qual===q?SQC[q]:"#9ca3af",padding:"7px 4px",fontSize:11,fontWeight:600,cursor:"pointer"}}>{q}</button>))}</div></F>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10,marginBottom:12}}>{[{l:"HRV (ms)",k:"hrv",ph:"45"},{l:"RHR (bpm)",k:"rhr",ph:"42"},{l:"Body Battery %",k:"bb",ph:"80"}].map(({l,k,ph})=>(<F key={k} label={l} mb={0}><input style={INP} type="number" inputMode="numeric" placeholder={ph} value={slF[k]} onChange={e=>setSlF(p=>({...p,[k]:e.target.value}))}/></F>))}</div>
        <div style={{marginBottom:12}}>
          <div style={{fontSize:10,color:"#9ca3af",marginBottom:6,letterSpacing:1}}>SCHLAFPHASEN (optional, in Minuten)</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr 1fr",gap:8}}>{[{l:"Tief",k:"deep",c:"#4f46e5"},{l:"REM",k:"rem",c:"#7c3aed"},{l:"Leicht",k:"light",c:"#60a5fa"},{l:"Wach",k:"awake",c:"#374151"}].map(({l,k,c})=>(<div key={k}><div style={{fontSize:9,color:c,marginBottom:3,fontWeight:700}}>{l}</div><input style={{...INP,padding:"8px",fontSize:14,textAlign:"center"}} type="number" inputMode="numeric" placeholder="0" value={slF[k]||""} onChange={e=>setSlF(p=>({...p,[k]:+e.target.value||0}))}/><div style={{fontSize:9,color:"#4b5563",textAlign:"center",marginTop:2}}>min</div></div>))}</div>
          {(slF.deep+slF.rem+slF.light+slF.awake)>0&&<div style={{marginTop:10}}><PhaseBar deep={slF.deep} rem={slF.rem} light={slF.light} awake={slF.awake}/></div>}
        </div>
        <F label="NOTIZ"><input style={INP} placeholder="z.B. Wettkampf gestern..." value={slF.note} onChange={e=>setSlF(p=>({...p,note:e.target.value}))}/></F>
        <Btns onCancel={()=>setModal(null)} onSave={addSl} saving={saving}/>
      </Sheet>)}

      {modal==="bp"&&(<Sheet onClose={()=>setModal(null)} title="🩺 Blutdruck eintragen">
        <div style={{display:"flex",gap:10,marginBottom:12}}>{[{l:"SYSTOLISCH *",k:"sys",ph:"138"},{l:"DIASTOLISCH *",k:"dia",ph:"75"},{l:"PULS",k:"pulse",ph:"44"}].map(({l,k,ph})=>(<div key={k} style={{flex:1}}><div style={{fontSize:10,color:"#9ca3af",marginBottom:4,letterSpacing:1}}>{l}</div><input style={INP} type="number" inputMode="numeric" placeholder={ph} value={bpF[k]} onChange={e=>setBpF(p=>({...p,[k]:e.target.value}))}/><div style={{fontSize:9,color:"#4b5563",marginTop:2}}>{k==="pulse"?"bpm":"mmHg"}</div></div>))}</div>
        {bpF.sys&&bpF.dia&&(()=>{const s=+bpF.sys,d=+bpF.dia;if(!s||!d)return null;const cl=clBP(s,d);return(<div style={{background:"#0a0a0a",border:`1px solid ${cl.color}44`,borderRadius:10,padding:"10px 14px",display:"flex",alignItems:"center",gap:10,marginBottom:12}}><span style={{fontSize:22,fontWeight:900,color:cl.color}}>{s}/{d}</span><span style={{fontSize:12,color:cl.color,fontWeight:600}}>{cl.label}</span></div>);})()}
        <F label="ZEITPUNKT (Berlin)"><input style={INP} type="datetime-local" value={bpF.dt} onChange={e=>setBpF(p=>({...p,dt:e.target.value}))}/></F>
        <F label="KONTEXT"><select style={{...INP,cursor:"pointer"}} value={bpF.ctx} onChange={e=>setBpF(p=>({...p,ctx:e.target.value}))}>{BP_CTX.map(c=><option key={c}>{c}</option>)}</select></F>
        <F label="NOTIZ"><input style={INP} placeholder="z.B. nach Kaffee..." value={bpF.note} onChange={e=>setBpF(p=>({...p,note:e.target.value}))}/></F>
        <Btns onCancel={()=>setModal(null)} onSave={addBP} saving={saving}/>
      </Sheet>)}

      {modal==="supp"&&(<Sheet onClose={()=>{setModal(null);setEditSId(null);}} title={editSId!==null?"✎ Supplement bearbeiten":"+ Neues Supplement"}>
        {[{l:"NAME *",k:"name",ph:"z.B. Vitamin D3"},{l:"DOSIERUNG",k:"dose",ph:"z.B. 2000 IE"},{l:"ZEITPUNKT",k:"timing",ph:"z.B. Morgens"},{l:"NOTIZ",k:"note",ph:"z.B. für Schlaf"}].map(({l,k,ph})=>(<F key={k} label={l}><input style={INP} placeholder={ph} value={sF[k]} onChange={e=>setSF(p=>({...p,[k]:e.target.value}))}/></F>))}
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:14}}>
          <F label="KATEGORIE" mb={0}><select style={{...INP,cursor:"pointer"}} value={sF.category} onChange={e=>setSF(p=>({...p,category:e.target.value}))}><option value="basis">Basis</option><option value="performance">Performance</option><option value="medikament">Medikament</option></select></F>
          <F label="STATUS" mb={0}><select style={{...INP,cursor:"pointer"}} value={sF.status} onChange={e=>setSF(p=>({...p,status:e.target.value}))}>{Object.entries(STATUS_CFG).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}</select></F>
        </div>
        <Btns onCancel={()=>{setModal(null);setEditSId(null);}} onSave={saveSupp} sl={editSId!==null?"Speichern":"Hinzufügen"} saving={saving}/>
      </Sheet>)}

      {toast&&(<div style={{position:"fixed",bottom:90,left:"50%",transform:"translateX(-50%)",background:toast.type==="warn"?"#2d0a0a":"#052e16",border:`1px solid ${toast.type==="warn"?"#991b1b":"#166534"}`,color:toast.type==="warn"?"#f87171":"#4ade80",borderRadius:12,padding:"10px 20px",fontSize:13,fontWeight:600,zIndex:200,whiteSpace:"nowrap",boxShadow:"0 4px 20px rgba(0,0,0,0.5)"}}>{toast.msg}</div>)}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
